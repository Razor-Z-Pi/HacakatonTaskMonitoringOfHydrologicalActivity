[project]
name = "hydromonitor"
version = "0.1.0"
description = "КосмоХакатон 2026 — оперативный мониторинг гидрологической динамики (Sentinel-1 SAR + Sentinel-2, сегментация воды/затопления)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "scipy>=1.14",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scikit-image>=0.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "earthengine-api>=1.7.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydromonitor"]

[tool.uv]
# собранный пакет устанавливается editable, чтобы `uv run python train.py` видел hydromonitor
package = true
