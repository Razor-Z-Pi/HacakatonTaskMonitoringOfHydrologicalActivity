# Пороги физического baseline и постобработки (все в одном месте, не в коде).
thresholds:
  sar:
    vv_min: -22.0     # нижняя граница диапазона VV (дБ) для порога Оцу
    vv_max: -12.0     # верхняя граница
    drop_db: 3.0      # падение VV на пике ≥ 3 дБ — физический признак затопления
  speckle:
    window: 5         # окно фильтра Ли (спекл-шум SAR)
  optical:
    mndwi: 0.1
    ndwi: 0.15
    ndvi: 0.2
    aweish: 0.0
  hydro:
    slope_max: 5.0    # уклон ≤ 5°
    hand_max: 25.0    # HAND ≤ 25 м
    min_unit_px: 25   # мин. картируемая единица (связные компоненты)
    permanent_occ: 80.0  # occurrence ≥ 80% → постоянное зеркало
