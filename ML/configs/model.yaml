# Параметры пиксельного классификатора LightGBM и сэмплирования.
model:
  sample:
    pos_cap: 50000    # макс. положительных пикселей (вода) на окно
    neg_ratio: 2.0    # отрицательных × (от числа отобранных положительных)
    seed: 42
  lgbm:
    objective: binary
    metric: binary_logloss
    boosting_type: gbdt
    num_leaves: 63
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    min_data_in_leaf: 50
    lambda_l1: 0.0
    lambda_l2: 1.0
    num_boost_round: 800
    early_stopping_round: 50
    verbosity: -1
    seed: 42
    n_jobs: -1
