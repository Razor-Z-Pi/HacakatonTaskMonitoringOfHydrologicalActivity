services:
  hydromonitor:
    build: ../../VS_Code/Hakaton/hydromonitor_backend/hydromonitor
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./predictions:/app/predictions
      - ./configs:/app/configs:ro
    environment:
      - HYDROMONITOR_CONFIG=/app/configs/config.yaml
    restart: unless-stopped